<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9900"/>
      <stop offset="1" stop-color="#ffb84d"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1c2748" stroke-width="1" opacity="0.5">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- challenge label -->
  <g transform="translate(72,70)">
    <rect x="0" y="0" width="360" height="34" rx="17" fill="#182240" stroke="#2b3a63"/>
    <circle cx="20" cy="17" r="5" fill="#ff9900"/>
    <text x="38" y="23" fill="#cdd6f4" font-size="15" letter-spacing="1.5">WEEKEND SHOWCASE CHALLENGE</text>
  </g>

  <!-- title -->
  <text x="72" y="215" fill="#f5f7ff" font-size="86" font-weight="700">x402 Weather Agent</text>
  <rect x="74" y="238" width="132" height="6" rx="3" fill="url(#accent)"/>

  <!-- subtitle -->
  <text x="74" y="292" fill="#aab4d4" font-size="30" font-weight="400">An AI agent that pays for its own API calls — safely.</text>

  <!-- flow -->
  <g transform="translate(74,360)" filter="url(#soft)">
    <!-- node 1 -->
    <rect x="0" y="0" width="210" height="86" rx="14" fill="#141d38" stroke="#33406b"/>
    <text x="105" y="36" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="600">Claude / MCP</text>
    <text x="105" y="60" text-anchor="middle" fill="#7f8db5" font-size="15">get_weather()</text>

    <!-- arrow -->
    <text x="242" y="22" text-anchor="middle" fill="#ff9900" font-size="16" font-weight="700">402</text>
    <path d="M222 43 H260" stroke="#ff9900" stroke-width="3" marker-end="url(#ah)"/>

    <!-- node 2 -->
    <rect x="278" y="0" width="288" height="86" rx="14" fill="#1a1330" stroke="#5a3fb0"/>
    <text x="422" y="34" text-anchor="middle" fill="#e6edf3" font-size="19" font-weight="600">AgentCore Payments</text>
    <text x="422" y="58" text-anchor="middle" fill="#a98fe0" font-size="15">ProcessPayment · budget in IAM</text>

    <!-- arrow -->
    <path d="M566 43 H612" stroke="#2ea043" stroke-width="3" marker-end="url(#ah2)"/>

    <!-- node 3 -->
    <rect x="628" y="0" width="252" height="86" rx="14" fill="#0d1f3d" stroke="#1f5fd6"/>
    <text x="754" y="34" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="600">USDC on Base</text>
    <text x="754" y="58" text-anchor="middle" fill="#5b8be6" font-size="15">$0.01 settled on-chain</text>
  </g>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#ff9900"/></marker>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2ea043"/></marker>
  </defs>

  <!-- tag strip -->
  <text x="74" y="560" fill="#6b779e" font-size="17" letter-spacing="0.5">Amazon Bedrock AgentCore Payments  ·  x402  ·  MCP  ·  Stripe Privy  ·  Base Sepolia</text>

  <!-- corner mark -->
  <text x="1128" y="588" text-anchor="end" fill="#586089" font-size="15">#application</text>
</svg>
